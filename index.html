<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EgyDead - استخراج المحتوى</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>EgyDead Extractor</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
            <select id="categorySelect">
                <option value="">كل الأقسام</option>
            </select>
            <button id="searchBtn">بحث</button>
        </div>
        <div id="results" class="grid"></div>
        <div id="pagination">
            <button id="prevPage" style="display:none;">السابق</button>
            <button id="nextPage" style="display:none;">التالي</button>
        </div>
        <div id="details" class="hidden">
            <div id="detailContent"></div>
            <h3>الحلقات</h3>
            <ul id="episodesList"></ul>
        </div>
        <div id="videoLinks" class="hidden">
            <h3>روابط المشاهدة</h3>
            <ul id="linksList"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
