<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeSlayer API - موقع تجريبي</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --danger: #f85149;
            --success: #3fb950;
            --warning: #d2991d;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Arabic', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ HEADER ============ */
        #app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            min-height: 56px;
        }

        #app-header .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            letter-spacing: -0.3px;
        }

        #app-header nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        #app-header button,
        #app-header .nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
        }
        #app-header button:hover,
        #app-header .nav-btn:hover {
            background: var(--border);
            border-color: var(--text-secondary);
        }
        #app-header button.active,
        #app-header .nav-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        /* ============ API KEY BAR ============ */
        #api-key-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #api-key-bar label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        #api-key-bar input {
            flex: 1;
            min-width: 200px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }
        #api-key-bar input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }
        #api-key-bar button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        #api-key-bar button:hover {
            background: var(--accent-hover);
        }
        #api-key-bar .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-dot.ok {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        .status-dot.err {
            background: var(--danger);
            box-shadow: 0 0 8px var(--danger);
        }
        .status-dot.loading {
            background: var(--warning);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ============ MAIN CONTENT ============ */
        #main-content {
            padding: 20px 16px;
            max-width: 1300px;
            margin: 0 auto;
            min-height: 60vh;
        }

        /* ============ LOADING & ERRORS ============ */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #loading-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }
        #loading-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-banner {
            background: #2d1114;
            border: 1px solid var(--danger);
            color: #ffb3b3;
            padding: 14px 18px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-all;
        }
        .error-banner strong {
            color: #ff8a8a;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        /* ============ ANIME GRID ============ */
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--text);
            border-right: 3px solid var(--accent);
            padding-right: 12px;
        }

        #anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .anime-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .anime-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.15);
        }
        .anime-card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background: var(--bg);
            display: block;
        }
        .anime-card .card-info {
            padding: 10px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .anime-card .card-title {
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
        }
        .anime-card .card-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .anime-card .card-rating {
            color: var(--warning);
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* ============ DETAILS PAGE ============ */
        #details-page {
            display: none;
        }
        #details-page.visible {
            display: block;
        }
        .details-header {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
        }
        .details-header img {
            width: 200px;
            max-width: 100%;
            border-radius: var(--radius);
            object-fit: cover;
            aspect-ratio: 3/4;
            flex-shrink: 0;
        }
        .details-info {
            flex: 1;
            min-width: 240px;
        }
        .details-info h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        .details-info .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .details-info .meta-row span {
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }
        .details-info .description {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text);
            margin-top: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .btn-back {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 16px;
            transition: var(--transition);
        }
        .btn-back:hover {
            background: var(--border);
        }

        /* ============ EPISODES ============ */
        #episodes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 16px;
        }
        .episode-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .episode-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ============ STREAMS MODAL ============ */
        #streams-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #streams-modal.visible {
            opacity: 1;
            pointer-events: all;
        }
        #streams-modal .modal-inner {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 700px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        #streams-modal .modal-close {
            position: absolute;
            top: 12px;
            left: 16px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 50%;
            transition: var(--transition);
        }
        #streams-modal .modal-close:hover {
            background: var(--border);
        }
        #streams-modal h3 {
            margin-bottom: 16px;
            font-size: 1.1rem;
        }
        #streams-modal .stream-source {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-bottom: 10px;
        }
        #streams-modal .stream-source .source-name {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        #streams-modal .stream-source video {
            width: 100%;
            max-height: 350px;
            background: #000;
            border-radius: var(--radius-sm);
        }
        #streams-modal .stream-source a {
            color: var(--accent);
            word-break: break-all;
            font-size: 0.8rem;
        }
        .stream-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .stream-actions button,
        .stream-actions a {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
            font-family: inherit;
            transition: var(--transition);
        }
        .stream-actions button:hover,
        .stream-actions a:hover {
            background: var(--accent-hover);
        }

        /* ============ GENRES / NEWS / RECOMMENDATIONS ============ */
        #genres-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        #genres-list span {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }
        #genres-list span:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .news-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .news-card img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            background: var(--bg);
        }
        .news-card .news-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            #anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
            .details-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .details-header img {
                width: 150px;
            }
            #app-header {
                height: auto;
                padding: 10px 12px;
                gap: 8px;
            }
            #app-header .logo {
                font-size: 1rem;
            }
            #app-header button,
            #app-header .nav-btn {
                padding: 6px 10px;
                font-size: 0.75rem;
                border-radius: 16px;
            }
            #api-key-bar {
                flex-direction: column;
                align-items: stretch;
            }
            #api-key-bar input {
                min-width: auto;
            }
            #episodes-list {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
        @media (max-width: 400px) {
            #anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 8px;
            }
            .anime-card .card-title {
                font-size: 0.75rem;
            }
            .details-header img {
                width: 120px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header id="app-header">
        <span class="logo">🎬 AnimeSlayer Tester</span>
        <nav id="main-nav">
            <button class="nav-btn active" data-page="home">🏠 الرئيسية</button>
            <button class="nav-btn" data-page="genres">🏷️ التصنيفات</button>
            <button class="nav-btn" data-page="recommendations">⭐ التوصيات</button>
            <button class="nav-btn" data-page="news">📰 الأخبار</button>
        </nav>
    </header>

    <!-- ==================== API KEY BAR ==================== -->
    <div id="api-key-bar">
        <label for="api-key-input">🔑 مفتاح RapidAPI:</label>
        <input type="text" id="api-key-input" placeholder="أدخل مفتاح x-rapidapi-key هنا...">
        <button id="btn-save-key">💾 حفظ المفتاح</button>
        <button id="btn-test-config">🔍 اختبار الاتصال</button>
        <span id="connection-status" title="حالة الاتصال">
            <span class="status-dot" id="status-dot" style="background:#8b949e;"></span>
            <small id="status-text" style="color:#8b949e;margin-right:4px;">غير متصل</small>
        </span>
    </div>

    <!-- ==================== LOADING OVERLAY ==================== -->
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main id="main-content">
        <!-- الصفحة الرئيسية -->
        <div id="home-page">
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;">
                <input type="text" id="search-input" placeholder="🔍 بحث في الأنمي..." style="flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:20px;font-family:inherit;font-size:0.9rem;">
                <button id="btn-search" style="background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;">بحث</button>
            </div>
            <h2 class="section-title">📺 قائمة الأنمي</h2>
            <div id="anime-grid"></div>
            <div id="home-error" style="display:none;"></div>
        </div>

        <!-- صفحة التفاصيل -->
        <div id="details-page">
            <button class="btn-back" onclick="showHome()">⬅️ العودة للقائمة</button>
            <div id="details-container"></div>
            <h3 style="margin-top:20px;">📋 الحلقات</h3>
            <div id="episodes-list"></div>
            <div id="details-error" style="display:none;"></div>
        </div>

        <!-- صفحة التصنيفات -->
        <div id="genres-page" style="display:none;">
            <h2 class="section-title">🏷️ التصنيفات</h2>
            <div id="genres-list"></div>
            <div id="genres-error" style="display:none;"></div>
        </div>

        <!-- صفحة التوصيات -->
        <div id="recommendations-page" style="display:none;">
            <h2 class="section-title">⭐ التوصيات</h2>
            <div id="recommendations-grid" class="anime-grid-style" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;"></div>
            <div id="recommendations-error" style="display:none;"></div>
        </div>

        <!-- صفحة الأخبار -->
        <div id="news-page" style="display:none;">
            <h2 class="section-title">📰 آخر الأخبار</h2>
            <div id="news-list"></div>
            <div id="news-error" style="display:none;"></div>
        </div>
    </main>

    <!-- ==================== STREAMS MODAL ==================== -->
    <div id="streams-modal">
        <div class="modal-inner">
            <button class="modal-close" onclick="closeStreamsModal()">✕</button>
            <h3>🎬 روابط المشاهدة</h3>
            <div id="streams-content"></div>
        </div>
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    <script>
        (function() {
            // ============ DOM REFERENCES ============
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const apiKeyInput = $('#api-key-input');
            const btnSaveKey = $('#btn-save-key');
            const btnTestConfig = $('#btn-test-config');
            const statusDot = $('#status-dot');
            const statusText = $('#status-text');
            const loadingOverlay = $('#loading-overlay');
            const homePage = $('#home-page');
            const detailsPage = $('#details-page');
            const genresPage = $('#genres-page');
            const recommendationsPage = $('#recommendations-page');
            const newsPage = $('#news-page');
            const animeGrid = $('#anime-grid');
            const detailsContainer = $('#details-container');
            const episodesList = $('#episodes-list');
            const streamsModal = $('#streams-modal');
            const streamsContent = $('#streams-content');
            const searchInput = $('#search-input');
            const btnSearch = $('#btn-search');
            const homeError = $('#home-error');
            const detailsError = $('#details-error');
            const genresList = $('#genres-list');
            const genresError = $('#genres-error');
            const recommendationsGrid = $('#recommendations-grid');
            const recommendationsError = $('#recommendations-error');
            const newsList = $('#news-list');
            const newsError = $('#news-error');
            const navBtns = $$('#main-nav .nav-btn');

            // ============ STATE ============
            const RAPIDAPI_HOST = 'animeslayer-api.p.rapidapi.com';
            const BASE_URL = 'https://animeslayer-api.p.rapidapi.com';
            let apiKey = localStorage.getItem('animeslayer_api_key') || 'ceb4752baemsh66f9c20d13e570dp11cb61jsn8bd1cc4c986f';
            let allAnimeData = []; // cached anime list for frontend filtering
            let currentAnimeId = null;

            // Init
            apiKeyInput.value = apiKey;
            if (apiKey) {
                updateConnectionStatus('loading', 'جاري التحقق...');
                testConfig().then(ok => {
                    if (ok) loadHomeAnime();
                });
            }

            // ============ UTILITY: Flexible field extraction ============
            function extractValue(obj, possibleKeys, defaultValue = null) {
                if (!obj || typeof obj !== 'object') return defaultValue;
                for (const key of possibleKeys) {
                    if (obj[key] !== undefined && obj[key] !== null) {
                        return obj[key];
                    }
                    // nested check (e.g., "attributes.title")
                    if (typeof obj === 'object' && !Array.isArray(obj)) {
                        const found = findNested(obj, key);
                        if (found !== undefined) return found;
                    }
                }
                return defaultValue;
            }

            function findNested(obj, path) {
                const parts = path.split('.');
                let current = obj;
                for (const part of parts) {
                    if (current && typeof current === 'object' && part in current) {
                        current = current[part];
                    } else {
                        return undefined;
                    }
                }
                return current;
            }

            function extractArray(data, possibleKeys) {
                if (Array.isArray(data)) return data;
                if (!data || typeof data !== 'object') return [];
                for (const key of possibleKeys) {
                    if (Array.isArray(data[key])) return data[key];
                    if (data[key] && typeof data[key] === 'object' && Array.isArray(data[key].data))
                        return data[key].data;
                    if (data[key] && typeof data[key] === 'object' && Array.isArray(data[key].results))
                        return data[key].results;
                }
                // try to find any array in the object
                for (const val of Object.values(data)) {
                    if (Array.isArray(val) && val.length > 0) return val;
                }
                return [];
            }

            function safeString(val) {
                if (val === null || val === undefined) return '';
                return String(val);
            }

            function truncate(str, maxLen = 150) {
                const s = safeString(str);
                return s.length > maxLen ? s.substring(0, maxLen) + '...' : s;
            }

            // ============ API CALL ============
            async function apiCall(endpoint, params = {}, method = 'GET') {
                if (!apiKey) throw new Error('مفتاح API غير موجود. الرجاء إدخال المفتاح أولاً.');

                const url = new URL(BASE_URL + endpoint);
                if (method === 'GET') {
                    Object.entries(params).forEach(([k, v]) => {
                        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
                    });
                }

                console.log(`%c🚀 API Request: %c${method} %c${url.toString()}`,
                    'color:#58a6ff;font-weight:bold;', 'color:#fff;', 'color:#8b949e;');
                console.log(`%c   Headers: %c${JSON.stringify({ 'x-rapidapi-host': RAPIDAPI_HOST,
                    'x-rapidapi-key': apiKey.substring(0, 8) + '...' })}`,
                    'color:#d2991d;', 'color:#8b949e;');

                const options = {
                    method,
                    headers: {
                        'x-rapidapi-host': RAPIDAPI_HOST,
                        'x-rapidapi-key': apiKey,
                        'Content-Type': 'application/json',
                    },
                };
                if (method !== 'GET' && Object.keys(params).length > 0) {
                    options.body = JSON.stringify(params);
                }

                const response = await fetch(url.toString(), options);
                console.log(`%c📥 Response Status: %c${response.status} %c${response.statusText}`,
                    'color:#3fb950;', 'color:#fff;', 'color:#8b949e;');

                const rawText = await response.text();
                console.log(`%c📄 Raw Response (first 1000 chars): %c${rawText.substring(0, 1000)}`,
                    'color:#d2991d;', 'color:#8b949e;');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}\n${rawText.substring(0, 500)}`);
                }

                let data;
                try {
                    data = JSON.parse(rawText);
                    console.log(`%c✅ Parsed JSON:`, 'color:#3fb950;', data);
                } catch (e) {
                    console.warn('⚠️ Response is not JSON, returning raw text');
                    return { _raw: rawText, _isRaw: true };
                }
                return data;
            }

            // ============ CONNECTION STATUS ============
            function updateConnectionStatus(state, msg) {
                statusDot.className = 'status-dot ' + state;
                statusText.textContent = msg;
                statusText.style.color = state === 'ok' ? '#3fb950' : state === 'err' ? '#f85149' : state ===
                    'loading' ? '#d2991d' : '#8b949e';
                if (state === 'ok') statusDot.style.background = '#3fb950';
                else if (state === 'err') statusDot.style.background = '#f85149';
                else if (state === 'loading') statusDot.style.background = '#d2991d';
                else statusDot.style.background = '#8b949e';
            }

            async function testConfig() {
                if (!apiKey) {
                    updateConnectionStatus('err', 'لا يوجد مفتاح');
                    return false;
                }
                updateConnectionStatus('loading', 'جاري الاختبار...');
                try {
                    const data = await apiCall('/config');
                    console.log('✅ /config response:', data);
                    updateConnectionStatus('ok', 'متصل ✓');
                    return true;
                } catch (err) {
                    console.error('❌ /config failed:', err);
                    updateConnectionStatus('err', 'فشل الاتصال');
                    return false;

                container.innerHTML =

                [homePage, detailsPage, genresPage, recommendationsPage, newsPage].forEach(p => p.style.display =
                    'none');
                navBtns.forEach(b => b.classList.remove('active'));

                switch (page) {
                    case 'home':
                        homePage.style.display = 'block';
                        navBtns[0].classList.add('active');
                        break;
                    case 'genres':
                        genresPage.style.display = 'block';
                        navBtns[1].classList.add('active');
                        loadGenres();
                        break;
                    case 'recommendations':
                        recommendationsPage.style.display = 'block';

                        break;
                    case 'news':
                        newsPage.style.display = 'block';
                        navBtns[3].classList.add('active');
                        loadNews();
                        break;
                    default:
                        homePage.style.display = 'block';
                        navBtns[0].classList.add('active');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

                        'content'], '');
                        const imgTag = image && image.startsWith('http') ?
                            `<img src="${image}" alt="" onerror="this.style.display='none'">` : '';
                        return `
                  <div class="news-card">
                    ${imgTag}
                    <div>
                      <div class="news-title">${safeString(title)}</div>
                      ${excerpt ? `<div style="font-size:0.8rem;color:#8b949e;margin-top:4px;">${truncate(excerpt, 200)}</div>` : ''}
                      ${url ? `<a href="${url}" target="_blank" rel="noopener" style="color:#58a6ff;font-size:0.8rem;">اقرأ المزيد ←</a>` : ''}
                    </div>
                  </div>`;
                    }).join('');
                    hideError(newsError);
                } catch (err) {
                    console.error('❌ loadNews error:', err);
                    showError(newsError, err.message || 'فشل تحميل الأخبار');
                    newsList.innerHTML = '';
                } finally {
                    hideLoading();
                }
            }

            // ============ EVENT LISTENERS ============
            btnSaveKey.addEventListener('click', () => {
                apiKey = apiKeyInput.value.trim();
                if (apiKey) {
                    localStorage.setItem('animeslayer_api_key', apiKey);
                    updateConnectionStatus('loading', 'تم الحفظ، جاري الاختبار...');
                    testConfig().then(ok => {
                        if (ok) {
                            allAnimeData = [];
                            loadHomeAnime();
                        }
                    });
                } else {
                    localStorage.removeItem('animeslayer_api_key');
                    updateConnectionStatus('err', 'لا يوجد مفتاح');
                }
            });

            btnTestConfig.addEventListener('click', async () => {
                apiKey = apiKeyInput.value.trim();
                if (!apiKey) {
                    updateConnectionStatus('err', 'أدخل المفتاح أولاً');
                    return;
                }
                localStorage.setItem('animeslayer_api_key', apiKey);
                const ok = await testConfig();
                if (ok && allAnimeData.length === 0) {
                    loadHomeAnime();
                }
            });

            // Keyboard shortcut to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && streamsModal.classList.contains('visible')) {
                    closeStreamsModal();
                }
            });

            // ============ INITIAL LOG ============
            console.log('%c🎬 AnimeSlayer API Tester %cجاهز',
                'color:#58a6ff;font-size:1.2rem;font-weight:bold;', 'color:#3fb950;');
            console.log('%c📌 Base URL: %c' + BASE_URL, 'color:#d2991d;', 'color:#8b949e;');
            console.log('%c🔑 API Key loaded: %c' + (apiKey ? 'نعم (' + apiKey.substring(0, 6) + '...)' : 'لا'),
                'color:#d2991d;', 'color:#8b949e;');
            console.log('%c💡 جميع الطلبات والردود ستظهر هنا في الـ Console للتصحيح',
            'color:#8b949e;font-style:italic;');

        })();
    </script>
</body>
</html>
