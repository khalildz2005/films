<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeSlayer API - موقع تجريبي</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --danger: #f85149;
            --success: #3fb950;
            --warning: #d2991d;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Arabic', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        #app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            min-height: 56px;
        }

        #app-header .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            letter-spacing: -0.3px;
        }

        #app-header nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        #app-header button,
        #app-header .nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
        }
        #app-header button:hover,
        #app-header .nav-btn:hover {
            background: var(--border);
            border-color: var(--text-secondary);
        }
        #app-header button.active,
        #app-header .nav-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        #api-key-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #api-key-bar label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        #api-key-bar input {
            flex: 1;
            min-width: 200px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }
        #api-key-bar input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }
        #api-key-bar button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        #api-key-bar button:hover {
            background: var(--accent-hover);
        }
        #api-key-bar .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-dot.ok {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        .status-dot.err {
            background: var(--danger);
            box-shadow: 0 0 8px var(--danger);
        }
        .status-dot.loading {
            background: var(--warning);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #main-content {
            padding: 20px 16px;
            max-width: 1300px;
            margin: 0 auto;
            min-height: 60vh;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #loading-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }
        #loading-overlay .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-banner {
            background: #2d1114;
            border: 1px solid var(--danger);
            color: #ffb3b3;
            padding: 14px 18px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-all;
        }
        .error-banner strong { color: #ff8a8a; }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--text);
            border-right: 3px solid var(--accent);
            padding-right: 12px;
        }

        #anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .anime-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .anime-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.15);
        }
        .anime-card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background: var(--bg);
            display: block;
        }
        .anime-card .card-info {
            padding: 10px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .anime-card .card-title {
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
        }
        .anime-card .card-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .anime-card .card-rating {
            color: var(--warning);
            font-weight: 600;
            font-size: 0.8rem;
        }

        #details-page { display: none; }
        #details-page.visible { display: block; }

        .details-header {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
        }
        .details-header img {
            width: 200px;
            max-width: 100%;
            border-radius: var(--radius);
            object-fit: cover;
            aspect-ratio: 3/4;
            flex-shrink: 0;
        }
        .details-info {
            flex: 1;
            min-width: 240px;
        }
        .details-info h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        .details-info .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .details-info .meta-row span {
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }
        .details-info .description {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text);
            margin-top: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .btn-back {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 16px;
            transition: var(--transition);
        }
        .btn-back:hover { background: var(--border); }

        #episodes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 16px;
        }
        .episode-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .episode-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #streams-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #streams-modal.visible {
            opacity: 1;
            pointer-events: all;
        }
        #streams-modal .modal-inner {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 700px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        #streams-modal .modal-close {
            position: absolute;
            top: 12px;
            left: 16px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 50%;
            transition: var(--transition);
        }
        #streams-modal .modal-close:hover { background: var(--border); }
        #streams-modal h3 { margin-bottom: 16px; font-size: 1.1rem; }
        #streams-modal .stream-source {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-bottom: 10px;
        }
        #streams-modal .stream-source .source-name {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        #streams-modal .stream-source video {
            width: 100%;
            max-height: 350px;
            background: #000;
            border-radius: var(--radius-sm);
        }
        #streams-modal .stream-source a {
            color: var(--accent);
            word-break: break-all;
            font-size: 0.8rem;
        }
        .stream-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .stream-actions button,
        .stream-actions a {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
            font-family: inherit;
            transition: var(--transition);
        }
        .stream-actions button:hover,
        .stream-actions a:hover { background: var(--accent-hover); }

        #genres-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        #genres-list span {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }
        #genres-list span:hover { border-color: var(--accent); color: var(--accent); }

        .news-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .news-card img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            background: var(--bg);
        }
        .news-card .news-title { font-weight: 600; font-size: 0.95rem; }

        @media (max-width: 768px) {
            #anime-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .details-header { flex-direction: column; align-items: center; text-align: center; }
            .details-header img { width: 150px; }
            #app-header { height: auto; padding: 10px 12px; gap: 8px; }
            #app-header .logo { font-size: 1rem; }
            #app-header button, #app-header .nav-btn { padding: 6px 10px; font-size: 0.75rem; border-radius: 16px; }
            #api-key-bar { flex-direction: column; align-items: stretch; }
            #api-key-bar input { min-width: auto; }
            #episodes-list { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
        @media (max-width: 400px) {
            #anime-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
            .anime-card .card-title { font-size: 0.75rem; }
            .details-header img { width: 120px; }
        }
    </style>
</head>
<body>

    <header id="app-header">
        <span class="logo">🎬 AnimeSlayer Tester</span>
        <nav id="main-nav">
            <button class="nav-btn active" data-page="home">🏠 الرئيسية</button>
            <button class="nav-btn" data-page="genres">🏷️ التصنيفات</button>
            <button class="nav-btn" data-page="recommendations">⭐ التوصيات</button>
            <button class="nav-btn" data-page="news">📰 الأخبار</button>
        </nav>
    </header>

    <div id="api-key-bar">
        <label for="api-key-input">🔑 مفتاح RapidAPI:</label>
        <input type="text" id="api-key-input" placeholder="أدخل مفتاح x-rapidapi-key هنا...">
        <button id="btn-save-key">💾 حفظ المفتاح</button>
        <button id="btn-test-config">🔍 اختبار الاتصال</button>
        <span id="connection-status" title="حالة الاتصال">
            <span class="status-dot" id="status-dot" style="background:#8b949e;"></span>
            <small id="status-text" style="color:#8b949e;margin-right:4px;">غير متصل</small>
        </span>
    </div>

    <div id="loading-overlay"><div class="spinner"></div></div>

    <main id="main-content">
        <div id="home-page">
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;">
                <input type="text" id="search-input" placeholder="🔍 بحث في الأنمي..." style="flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:20px;font-family:inherit;font-size:0.9rem;">
                <button id="btn-search" style="background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;">بحث</button>
            </div>
            <h2 class="section-title">📺 قائمة الأنمي</h2>
            <div id="anime-grid"></div>
            <div id="home-error" style="display:none;"></div>
        </div>

        <div id="details-page">
            <button class="btn-back" onclick="showHome()">⬅️ العودة للقائمة</button>
            <div id="details-container"></div>
            <h3 style="margin-top:20px;">📋 الحلقات</h3>
            <div id="episodes-list"></div>
            <div id="details-error" style="display:none;"></div>
        </div>

        <div id="genres-page" style="display:none;">
            <h2 class="section-title">🏷️ التصنيفات</h2>
            <div id="genres-list"></div>
            <div id="genres-error" style="display:none;"></div>
        </div>

        <div id="recommendations-page" style="display:none;">
            <h2 class="section-title">⭐ التوصيات</h2>
            <div id="recommendations-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;"></div>
            <div id="recommendations-error" style="display:none;"></div>
        </div>

        <div id="news-page" style="display:none;">
            <h2 class="section-title">📰 آخر الأخبار</h2>
            <div id="news-list"></div>
            <div id="news-error" style="display:none;"></div>
        </div>
    </main>

    <div id="streams-modal">
        <div class="modal-inner">
            <button class="modal-close" onclick="closeStreamsModal()">✕</button>
            <h3>🎬 روابط المشاهدة</h3>
            <div id="streams-content"></div>
        </div>
    </div>

    <script>
        (function() {
            // DOM refs
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const apiKeyInput = $('#api-key-input');
            const btnSaveKey = $('#btn-save-key');
            const btnTestConfig = $('#btn-test-config');
            const statusDot = $('#status-dot');
            const statusText = $('#status-text');
            const loadingOverlay = $('#loading-overlay');
            const homePage = $('#home-page');
            const detailsPage = $('#details-page');
            const genresPage = $('#genres-page');
            const recommendationsPage = $('#recommendations-page');
            const newsPage = $('#news-page');
            const animeGrid = $('#anime-grid');
            const detailsContainer = $('#details-container');
            const episodesList = $('#episodes-list');
            const streamsModal = $('#streams-modal');
            const streamsContent = $('#streams-content');
            const searchInput = $('#search-input');
            const btnSearch = $('#btn-search');
            const homeError = $('#home-error');
            const detailsError = $('#details-error');
            const genresList = $('#genres-list');
            const genresError = $('#genres-error');
            const recommendationsGrid = $('#recommendations-grid');
            const recommendationsError = $('#recommendations-error');
            const newsList = $('#news-list');
            const newsError = $('#news-error');
            const navBtns = $$('#main-nav .nav-btn');

            const RAPIDAPI_HOST = 'animeslayer-api.p.rapidapi.com';
            const BASE_URL = 'https://animeslayer-api.p.rapidapi.com';
            let apiKey = localStorage.getItem('animeslayer_api_key') || 'ceb4752baemsh66f9c20d13e570dp11cb61jsn8bd1cc4c986f';
            let allAnimeData = [];
            let currentAnimeData = null; // store loaded anime details for episodes

            apiKeyInput.value = apiKey;
            if (apiKey) {
                updateConnectionStatus('loading', 'جاري التحقق...');
                testConfig().then(ok => { if (ok) loadHomeAnime(); });
            }

            // ========== Utility ==========
            function extractValue(obj, possibleKeys, defaultValue = null) {
                if (!obj || typeof obj !== 'object') return defaultValue;
                for (const key of possibleKeys) {
                    if (obj[key] !== undefined && obj[key] !== null) return obj[key];
                    if (typeof obj === 'object' && !Array.isArray(obj)) {
                        const found = findNested(obj, key);
                        if (found !== undefined) return found;
                    }
                }
                return defaultValue;
            }

            function findNested(obj, path) {
                const parts = path.split('.');
                let current = obj;
                for (const part of parts) {
                    if (current && typeof current === 'object' && part in current) {
                        current = current[part];
                    } else return undefined;
                }
                return current;
            }

            function extractArray(data, possibleKeys) {
                if (Array.isArray(data)) return data;
                if (!data || typeof data !== 'object') return [];
                for (const key of possibleKeys) {
                    if (Array.isArray(data[key])) return data[key];
                    if (data[key] && typeof data[key] === 'object' && Array.isArray(data[key].data)) return data[key].data;
                    if (data[key] && typeof data[key] === 'object' && Array.isArray(data[key].results)) return data[key].results;
                }
                for (const val of Object.values(data)) {
                    if (Array.isArray(val) && val.length > 0) return val;
                }
                return [];
            }

            function safeString(val) {
                if (val === null || val === undefined) return '';
                return String(val);
            }

            function truncate(str, maxLen = 150) {
                const s = safeString(str);
                return s.length > maxLen ? s.substring(0, maxLen) + '...' : s;
            }

            // ========== API call ==========
            async function apiCall(endpoint, params = {}, method = 'GET') {
                if (!apiKey) throw new Error('مفتاح API غير موجود.');
                const url = new URL(BASE_URL + endpoint);
                if (method === 'GET') {
                    Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v); });
                }
                const options = {
                    method,
                    headers: {
                        'x-rapidapi-host': RAPIDAPI_HOST,
                        'x-rapidapi-key': apiKey,
                        'Content-Type': 'application/json',
                    },
                };
                if (method !== 'GET' && Object.keys(params).length > 0) options.body = JSON.stringify(params);
                const response = await fetch(url.toString(), options);
                const rawText = await response.text();
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}\n${rawText.substring(0, 500)}`);
                try {
                    return JSON.parse(rawText);
                } catch (e) {
                    return { _raw: rawText, _isRaw: true };
                }
            }

            function updateConnectionStatus(state, msg) {
                statusDot.className = 'status-dot ' + state;
                statusText.textContent = msg;
                statusText.style.color = state === 'ok' ? '#3fb950' : state === 'err' ? '#f85149' : state === 'loading' ? '#d2991d' : '#8b949e';
                statusDot.style.background = state === 'ok' ? '#3fb950' : state === 'err' ? '#f85149' : state === 'loading' ? '#d2991d' : '#8b949e';
            }

            async function testConfig() {
                if (!apiKey) { updateConnectionStatus('err', 'لا يوجد مفتاح'); return false; }
                updateConnectionStatus('loading', 'جاري الاختبار...');
                try {
                    await apiCall('/config');
                    updateConnectionStatus('ok', 'متصل ✓');
                    return true;
                } catch (err) {
                    updateConnectionStatus('err', 'فشل الاتصال');
                    return false;
                }
            }

            function showLoading() { loadingOverlay.classList.add('visible'); }
            function hideLoading() { loadingOverlay.classList.remove('visible'); }

            function showError(container, message) {
                if (!container) return;
                container.style.display = 'block';
                container.innerHTML = `<div class="error-banner"><strong>⚠️ خطأ:</strong><br>${message.replace(/\n/g, '<br>')}</div>`;
            }
            function hideError(container) { if (container) { container.style.display = 'none'; container.innerHTML = ''; } }

            // ========== Page switching (simplified) ==========
            function switchPage(page) {
                [homePage, detailsPage, genresPage, recommendationsPage, newsPage].forEach(p => p.style.display = 'none');
                detailsPage.classList.remove('visible');
                navBtns.forEach(b => b.classList.remove('active'));
                if (page === 'details') {
                    detailsPage.style.display = 'block';
                    detailsPage.classList.add('visible');
                } else {
                    const pages = { home: homePage, genres: genresPage, recommendations: recommendationsPage, news: newsPage };
                    if (pages[page]) pages[page].style.display = 'block';
                    const idx = { home: 0, genres: 1, recommendations: 2, news: 3 };
                    if (navBtns[idx[page]]) navBtns[idx[page]].classList.add('active');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            navBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = btn.dataset.page;
                    switchPage(page);
                    if (page === 'genres') loadGenres();
                    else if (page === 'recommendations') loadRecommendations();
                    else if (page === 'news') loadNews();
                });
            });

            window.showHome = function() {
                switchPage('home');
                if (allAnimeData.length === 0 && apiKey) loadHomeAnime();
            };

            window._showDetails = function(id) {
                if (!id) return;
                currentAnimeId = id;
                switchPage('details');
                loadAnimeDetails(id);
            };

            function closeStreamsModal() {
                streamsModal.classList.remove('visible');
                streamsContent.innerHTML = '';
            }
            window.closeStreamsModal = closeStreamsModal;
            streamsModal.addEventListener('click', function(e) { if (e.target === streamsModal) closeStreamsModal(); });

            // ========== Home & grid ==========
            async function loadHomeAnime(searchQuery = '') {
                hideError(homeError);
                animeGrid.innerHTML = '<div class="empty-state"><span class="icon">⏳</span>جاري تحميل الأنمي...</div>';
                showLoading();
                try {
                    const params = { limit: 50 };
                    if (searchQuery.trim()) { params.search = searchQuery.trim(); params.limit = 100; }
                    const data = await apiCall('/anime', params);
                    const animeList = extractArray(data, ['data', 'results', 'items', 'anime', 'animes', 'list']);
                    allAnimeData = animeList;
                    renderAnimeGrid(animeList);
                    hideError(homeError);
                } catch (err) {
                    showError(homeError, err.message || 'فشل تحميل قائمة الأنمي');
                    animeGrid.innerHTML = '<div class="empty-state"><span class="icon">😢</span>تعذر تحميل الأنمي</div>';
                } finally { hideLoading(); }
            }

            function renderAnimeGrid(animeList) {
                if (!animeList || animeList.length === 0) {
                    animeGrid.innerHTML = '<div class="empty-state"><span class="icon">📭</span>لا يوجد أنمي لعرضه</div>';
                    return;
                }
                animeGrid.innerHTML = animeList.map(anime => {
                    const id = extractValue(anime, ['anime_id', 'id', '_id', 'slug']);
                    const title = extractValue(anime, ['anime_name', 'title', 'name', 'title_en', 'title_ar', 'english_title'], 'غير معروف');
                    const image = extractValue(anime, ['anime_cover_image_url', 'image', 'poster', 'poster_url', 'thumbnail', 'cover_image', 'image_url', 'main_picture'], '');
                    const rating = extractValue(anime, ['anime_rating', 'rating', 'score', 'average_rating', 'mal_rating', 'rating_score'], null);
                    const type = extractValue(anime, ['anime_type', 'type', 'media_type'], '');
                    const status = extractValue(anime, ['anime_status', 'status', 'airing_status'], '');
                    const imgSrc = (image && image.startsWith('http')) ? image : '';
                    const imgFallback = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="213" fill="%23161b22"><rect width="160" height="213"/><text x="80" y="110" text-anchor="middle" fill="%238b949e" font-size="14">No Image</text></svg>');
                    return `
                <div class="anime-card" onclick="window._showDetails('${id || ''}')" data-id="${id || ''}">
                  <img src="${imgSrc || imgFallback}" alt="${safeString(title)}" loading="lazy" onerror="this.src='${imgFallback}'">
                  <div class="card-info">
                    <div class="card-title" title="${safeString(title)}">${safeString(title)}</div>
                    <div class="card-meta">
                      ${type ? `<span>${safeString(type)}</span>` : ''}
                      ${status ? `<span>${safeString(status)}</span>` : ''}
                    </div>
                    ${rating !== null && rating !== undefined ? `<div class="card-rating">⭐ ${safeString(rating)}</div>` : '<div class="card-rating" style="color:#8b949e;">—</div>'}
                  </div>
                </div>`;
                }).join('');
            }

            btnSearch.addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query && apiKey) {
                    loadHomeAnime(query);
                } else if (allAnimeData.length > 0) {
                    const q = query.toLowerCase();
                    const filtered = allAnimeData.filter(a => {
                        const t = extractValue(a, ['anime_name', 'title', 'name', 'title_en'], '');
                        return safeString(t).toLowerCase().includes(q);
                    });
                    renderAnimeGrid(filtered);
                }
            });
            searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnSearch.click(); });

            // ========== Anime details ==========
            async function loadAnimeDetails(animeId) {
                hideError(detailsError);
                detailsContainer.innerHTML = '<div class="empty-state"><span class="icon">⏳</span>جاري تحميل التفاصيل...</div>';
                episodesList.innerHTML = '';
                showLoading();
                try {
                    const data = await apiCall(`/anime/${animeId}`, { more_info: 'true', episodes: 'true' });
                    const anime = extractValue(data, ['data', 'anime', 'result', 'item']) || data;
                    currentAnimeData = anime; // store for episodes

                    const title = extractValue(anime, ['anime_name', 'title', 'name', 'anime_english_title', 'english_title'], 'غير معروف');
                    const image = extractValue(anime, ['anime_cover_image_url', 'anime_banner_image_url', 'image', 'poster', 'poster_url', 'cover_image', 'image_url'], '');
                    const description = extractValue(anime, ['anime_description', 'description', 'synopsis', 'story', 'summary', 'overview'], 'لا يوجد وصف');
                    const rating = extractValue(anime, ['anime_rating', 'rating', 'score', 'average_rating'], '—');
                    const type = extractValue(anime, ['anime_type', 'type', 'media_type'], '—');
                    const status = extractValue(anime, ['anime_status', 'status', 'airing_status'], '—');
                    const genresRaw = extractValue(anime, ['anime_genres', 'genres', 'genre', 'tags', 'categories'], '');
                    const genresStr = Array.isArray(genresRaw) ? genresRaw.map(g => typeof g === 'object' ? (g.name || g.title || g.genre_name || '') : safeString(g)).filter(Boolean).join('، ') : safeString(genresRaw);
                    const year = extractValue(anime, ['anime_release_year', 'year', 'release_year', 'start_date'], '');
                    const season = extractValue(anime, ['anime_season', 'season'], '');
                    const episodesCount = extractValue(anime, ['more_info_result.episodes', 'episodes.count', 'total_episodes', 'episode_count'], '?');
                    const scoreBy = extractValue(anime, ['more_info_result.scored_by', 'scored_by'], '');
                    const duration = extractValue(anime, ['more_info_result.duration', 'duration'], '');
                    const studios = extractValue(anime, ['more_info_result.anime_studios', 'anime_studios'], '');

                    const imgSrc = (image && image.startsWith('http')) ? image : 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="267" fill="%23161b22"><rect width="200" height="267"/><text x="100" y="140" text-anchor="middle" fill="%238b949e" font-size="16">No Image</text></svg>');

                    detailsContainer.innerHTML = `
                <div class="details-header">
                  <img src="${imgSrc}" alt="${safeString(title)}" onerror="this.src='data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="267" fill="%23161b22"><rect width="200" height="267"/><text x="100" y="140" text-anchor="middle" fill="%238b949e">Error</text></svg>')}'">
                  <div class="details-info">
                    <h2>${safeString(title)}</h2>
                    <div class="meta-row">
                      ${type !== '—' ? `<span>📺 ${safeString(type)}</span>` : ''}
                      ${status !== '—' ? `<span>📡 ${safeString(status)}</span>` : ''}
                      ${rating !== '—' ? `<span>⭐ ${safeString(rating)}</span>` : ''}
                      ${year ? `<span>📅 ${safeString(year)}</span>` : ''}
                      ${season ? `<span>🍃 ${safeString(season)}</span>` : ''}
                      ${episodesCount !== '?' ? `<span>🎬 ${safeString(episodesCount)} حلقة</span>` : ''}
                      ${duration ? `<span>⏱️ ${safeString(duration)}</span>` : ''}
                      ${studios ? `<span>🏢 ${safeString(studios)}</span>` : ''}
                      ${scoreBy ? `<span>👥 ${safeString(scoreBy)} مصوّت</span>` : ''}
                    </div>
                    ${genresStr ? `<div class="meta-row"><span>🏷️ ${genresStr}</span></div>` : ''}
                    <div class="description">${safeString(description)}</div>
                  </div>
                </div>`;
                    hideError(detailsError);
                } catch (err) {
                    showError(detailsError, err.message || 'فشل تحميل تفاصيل الأنمي');
                    detailsContainer.innerHTML = '';
                } finally {
                    hideLoading();
                    // after details loaded, load episodes from stored data or separate call
                    loadEpisodes(animeId);
                }
            }

            // ========== Episodes ==========
            async function loadEpisodes(animeId) {
                episodesList.innerHTML = '<div class="empty-state"><span class="icon">⏳</span>جاري تحميل الحلقات...</div>';
                try {
                    let episodesArr = [];
                    // prefer data from already fetched anime details
                    if (currentAnimeData && currentAnimeData.episodes && Array.isArray(currentAnimeData.episodes.data)) {
                        episodesArr = currentAnimeData.episodes.data;
                    } else {
                        // fallback to separate episodes endpoint
                        const data = await apiCall(`/anime/${animeId}/episodes`, { version: 'new', limit: 200 });
                        // response may contain data array directly or under 'episodes' key
                        episodesArr = extractArray(data, ['episodes', 'data', 'results', 'items', 'list']);
                        if (episodesArr.length === 0 && Array.isArray(data.episodes?.data)) {
                            episodesArr = data.episodes.data;
                        }
                    }

                    if (!episodesArr || episodesArr.length === 0) {
                        episodesList.innerHTML = '<div class="empty-state"><span class="icon">📭</span>لا توجد حلقات متاحة</div>';
                        return;
                    }

                    episodesList.innerHTML = episodesArr.map(ep => {
                        const epId = extractValue(ep, ['episode_id', 'id', '_id', 'number']);
                        const epNum = extractValue(ep, ['episode_number', 'number', 'ep'], safeString(epId));
                        const epName = extractValue(ep, ['episode_name', 'title', 'name', 'episode_title'], '');
                        const label = epName ? `${safeString(epNum)} - ${safeString(epName)}` : `الحلقة ${safeString(epNum)}`;
                        return `<button class="episode-btn" onclick="window._loadStreams('${animeId}', '${epId}')" title="${safeString(label)}">🎬 ${safeString(label)}</button>`;
                    }).join('');
                } catch (err) {
                    episodesList.innerHTML = '<div class="empty-state"><span class="icon">⚠️</span>تعذر تحميل الحلقات</div>';
                }
            }

            // ========== Streams modal ==========
            window._loadStreams = async function(animeId, episodeId) {
                streamsContent.innerHTML = '<div class="empty-state"><span class="icon">⏳</span>جاري تحميل روابط المشاهدة...</div>';
                streamsModal.classList.add('visible');
                showLoading();
                try {
                    const data = await apiCall(`/anime/${animeId}/episodes/${episodeId}/streams`);
                    const providers = extractValue(data, ['providers'], []);
                    if (!Array.isArray(providers) || providers.length === 0) {
                        // attempt fallback array extraction
                        const arr = extractArray(data, ['providers', 'data', 'results', 'streams', 'sources']);
                        if (arr.length > 0) {
                            renderStreamsFromProviders(arr);
                        } else {
                            streamsContent.innerHTML = '<div class="empty-state"><span class="icon">📭</span>لا توجد روابط مشاهدة</div>';
                        }
                        return;
                    }
                    renderStreamsFromProviders(providers);
                } catch (err) {
                    streamsContent.innerHTML = `<div class="error-banner"><strong>⚠️ خطأ:</strong><br>${err.message}</div>`;
                } finally { hideLoading(); }
            };

            function renderStreamsFromProviders(providers) {
                let html = '';
                providers.forEach(prov => {
                    if (prov.type === 'cdn' && Array.isArray(prov.signed_urls)) {
                        html += `<div class="stream-source"><div class="source-name">📡 CDN (خوادم مباشرة)</div>`;
                        prov.signed_urls.forEach(s => {
                            const label = s.label || s.quality || '';
                            const quality = s.quality || '';
                            const url = s.url || '';
                            html += `
                            <div style="margin-bottom:8px; border-bottom:1px solid #30363d; padding-bottom:6px;">
                              <div style="font-weight:500;margin-bottom:4px;">${safeString(label)} ${quality ? `(${quality})` : ''}</div>
                              <div class="stream-actions">
                                ${url ? `<a href="${url}" target="_blank" rel="noopener">🔗 فتح</a>` : ''}
                                ${url ? `<button onclick="navigator.clipboard.writeText('${url}').then(()=>alert('تم النسخ'))">📋 نسخ</button>` : ''}
                              </div>
                              ${url ? `<div style="font-size:0.7rem;color:#8b949e;margin-top:4px;word-break:break-all;">${url}</div>` : ''}
                            </div>`;
                        });
                        html += `</div>`;
                    } else if (prov.type === 'muilt' && Array.isArray(prov.providers)) {
                        html += `<div class="stream-source"><div class="source-name">🌐 روابط خارجية</div>`;
                        prov.providers.forEach(p => {
                            const label = p.label || 'مصدر';
                            const url = p.url || '';
                            html += `
                            <div style="margin-bottom:8px;">
                              <div style="font-weight:500;">${safeString(label)}</div>
                              <div class="stream-actions" style="margin-top:4px;">
                                ${url ? `<a href="${url}" target="_blank">🔗 فتح</a>` : ''}
                                ${url ? `<button onclick="navigator.clipboard.writeText('${url}').then(()=>alert('تم النسخ'))">📋 نسخ</button>` : ''}
                              </div>
                              ${url ? `<div style="font-size:0.7rem;color:#8b949e;word-break:break-all;">${url}</div>` : ''}
                            </div>`;
                        });
                        html += `</div>`;
                    } else {
                        // unknown structure, try to display as generic
                        const label = prov.label || prov.name || prov.type || 'مصدر';
                        const url = prov.url || '';
                        html += `<div class="stream-source"><div class="source-name">📡 ${safeString(label)}</div>
                          <div class="stream-actions">${url ? `<a href="${url}" target="_blank">🔗 فتح</a>` : ''} ${url ? `<button onclick="navigator.clipboard.writeText('${url}').then(()=>alert('تم النسخ'))">📋 نسخ</button>` : ''}</div>
                          ${url ? `<div style="font-size:0.7rem;color:#8b949e;word-break:break-all;">${url}</div>` : ''}
                        </div>`;
                    }
                });
                streamsContent.innerHTML = html || '<div class="empty-state"><span class="icon">📭</span>لا توجد روابط</div>';
            }

            // ========== Genres, Recommendations, News ==========
            async function loadGenres() {
                hideError(genresError);
                genresList.innerHTML = '<div class="empty-state"><span class="icon">⏳</span>جاري تحميل التصنيفات...</div>';
                showLoading();
                try {
                    const data = await apiCall('/genres');
                    const genres = extractArray(data, ['data', 'results', 'items', 'genres', 'list']);
                    if (genres.length === 0) {
                        genresList.innerHTML = '<div class="empty-state"><span class="icon">📭</span>لا توجد تصنيفات</div>';
                        return;
                    }
                    genresList.innerHTML = genres.map(g => {
                        const name = extractValue(g, ['name', 'title', 'genre_name', 'label'], 'غير معروف');
                        return `<span onclick="switchPage('home');searchInput.value='${safeString(name)}';btnSearch.click();" title="بحث عن ${safeString(name)}">${safeString(name)}</span>`;
                    }).join('');
                    hideError(genresError);
                } catch (err) {
                    showError(genresError, err.message || 'فشل تحميل التصنيفات');
                    genresList.innerHTML = '';
                } finally { hideLoading(); }
            }

            async function loadRecommendations() {
                hideError(recommendationsError);
                recommendationsGrid.innerHTML = '<div class="empty-state"><span class="icon">⏳</span>جاري تحميل التوصيات...</div>';
                showLoading();
                try {
                    const data = await apiCall('/recommendations');
                    const recs = extractArray(data, ['data', 'results', 'items', 'recommendations', 'list']);
                    if (recs.length === 0) {
                        recommendationsGrid.innerHTML = '<div class="empty-state"><span class="icon">📭</span>لا توجد توصيات</div>';
                        return;
                    }
                    recommendationsGrid.innerHTML = recs.map(rec => {
                        const id = extractValue(rec, ['anime_id', 'id', '_id', 'slug']);
                        const title = extractValue(rec, ['anime_name', 'title', 'name', 'title_en'], 'غير معروف');
                        const image = extractValue(rec, ['anime_cover_image_url', 'image', 'poster', 'poster_url', 'thumbnail'], '');
                        const rating = extractValue(rec, ['anime_rating', 'rating', 'score'], null);
                        const imgSrc = (image && image.startsWith('http')) ? image : 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="213" fill="%23161b22"><rect width="160" height="213"/><text x="80" y="110" text-anchor="middle" fill="%238b949e">No Image</text></svg>');
                        return `
                    <div class="anime-card" onclick="window._showDetails('${id || ''}')">
                      <img src="${imgSrc}" alt="${safeString(title)}" loading="lazy" onerror="this.src='data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="213" fill="%23161b22"><rect width="160" height="213"/><text x="80" y="110" text-anchor="middle" fill="%238b949e">Error</text></svg>')}'">
                      <div class="card-info">
                        <div class="card-title">${safeString(title)}</div>
                        ${rating !== null ? `<div class="card-rating">⭐ ${safeString(rating)}</div>` : ''}
                      </div>
                    </div>`;
                    }).join('');
                    hideError(recommendationsError);
                } catch (err) {
                    showError(recommendationsError, err.message || 'فشل تحميل التوصيات');
                    recommendationsGrid.innerHTML = '';
                } finally { hideLoading(); }
            }

            async function loadNews() {
                hideError(newsError);
                newsList.innerHTML = '<div class="empty-state"><span class="icon">⏳</span>جاري تحميل الأخبار...</div>';
                showLoading();
                try {
                    const data = await apiCall('/news');
                    const news = extractArray(data, ['data', 'results', 'items', 'news', 'articles', 'list']);
                    if (news.length === 0) {
                        newsList.innerHTML = '<div class="empty-state"><span class="icon">📭</span>لا توجد أخبار</div>';
                        return;
                    }
                    newsList.innerHTML = news.map(n => {
                        const title = extractValue(n, ['title', 'name', 'headline', 'news_title'], 'بدون عنوان');
                        const image = extractValue(n, ['image', 'thumbnail', 'cover', 'image_url'], '');
                        const url = extractValue(n, ['url', 'link', 'news_url'], '');
                        const excerpt = extractValue(n, ['excerpt', 'description', 'summary', 'content'], '');
                        const imgTag = (image && image.startsWith('http')) ? `<img src="${image}" alt="" onerror="this.style.display='none'">` : '';
                        return `
                    <div class="news-card">
                      ${imgTag}
                      <div>
                        <div class="news-title">${safeString(title)}</div>
                        ${excerpt ? `<div style="font-size:0.8rem;color:#8b949e;margin-top:4px;">${truncate(excerpt, 200)}</div>` : ''}
                        ${url ? `<a href="${url}" target="_blank" rel="noopener" style="color:#58a6ff;font-size:0.8rem;">اقرأ المزيد ←</a>` : ''}
                      </div>
                    </div>`;
                    }).join('');
                    hideError(newsError);
                } catch (err) {
                    showError(newsError, err.message || 'فشل تحميل الأخبار');
                    newsList.innerHTML = '';
                } finally { hideLoading(); }
            }

            // ========== Event listeners ==========
            btnSaveKey.addEventListener('click', () => {
                apiKey = apiKeyInput.value.trim();
                if (apiKey) {
                    localStorage.setItem('animeslayer_api_key', apiKey);
                    updateConnectionStatus('loading', 'تم الحفظ، جاري الاختبار...');
                    testConfig().then(ok => { if (ok) { allAnimeData = []; loadHomeAnime(); } });
                } else {
                    localStorage.removeItem('animeslayer_api_key');
                    updateConnectionStatus('err', 'لا يوجد مفتاح');
                }
            });

            btnTestConfig.addEventListener('click', async () => {
                apiKey = apiKeyInput.value.trim();
                if (!apiKey) { updateConnectionStatus('err', 'أدخل المفتاح أولاً'); return; }
                localStorage.setItem('animeslayer_api_key', apiKey);
                const ok = await testConfig();
                if (ok && allAnimeData.length === 0) loadHomeAnime();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && streamsModal.classList.contains('visible')) closeStreamsModal();
            });

            console.log('%c🎬 AnimeSlayer API Tester %cجاهز', 'color:#58a6ff;font-size:1.2rem;font-weight:bold;', 'color:#3fb950;');
            console.log('%c📌 Base URL: %c' + BASE_URL, 'color:#d2991d;', 'color:#8b949e;');
            console.log('%c🔑 API Key loaded: %c' + (apiKey ? 'نعم (' + apiKey.substring(0, 6) + '...)' : 'لا'), 'color:#d2991d;', 'color:#8b949e;');
            console.log('%c💡 جميع الطلبات والردود ستظهر هنا في الـ Console للتصحيح', 'color:#8b949e;font-style:italic;');
        })();
    </script>
</body>
</html>
